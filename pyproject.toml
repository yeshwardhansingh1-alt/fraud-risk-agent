[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-risk-agent"
version = "0.1.0"
description = "Cost-sensitive fraud-spike detector"
authors = [{name = "Antigravity"}]
dependencies = [
    "pandas==2.2.3",
    "numpy==1.26.4",
    "scikit-learn==1.5.2",
    "lightgbm==4.5.0",
    "shap==0.46.0",
    "matplotlib==3.9.2",
    "networkx==3.4.2",
    "joblib==1.4.2",
    "kaggle==1.6.17",
    "fastapi==0.115.0",
    "uvicorn==0.32.0",
    "streamlit==1.40.1",
    "requests==2.32.3",
    "pydantic==2.9.2",
    "optuna==4.9.0",
    "pandera==0.33.0",
    "pyarrow==25.0.1",
    "slowapi==0.1.10",
    "redis==5.3.1",
    "xgboost==3.4.1",
    "locust",
    "playwright",
    "pytest-playwright"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent", "features", "model", "dashboard", "notebooks"]
