version: '3.8'
services:
  redis:
    image: redis:alpine
    container_name: fraud-redis
    ports:
      - "6379:6379"
    mem_limit: 256m
    command: ["redis-server", "--appendonly", "yes"]

  api:
    build: .
    container_name: fraud-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
